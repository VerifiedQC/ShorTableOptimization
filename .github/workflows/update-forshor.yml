name: Update ForShor

# Follows the companion's `main` branch. `lakefile.lean` tracks `main`, but
# `lake-manifest.json` pins a resolved commit and is what every build reads, so
# the dependency only advances when something runs `lake update`. That is this
# workflow.
#
# It pushes to `main` without review, which is safe only because it refuses to
# push unless the companion's cost model is unchanged. That is what
# `scripts/tests/companion-cost-model.tsv` pins: the primitive gate costs, the
# allocation costs and the width transitions, which is everything the planner
# reads from the companion. If any of it moves, the job fails and leaves `main`
# alone -- that bump is a decision, not a chore.
#
# The gate deliberately does NOT pin planner totals. Totals are a function of
# the accepted archive as well as the cost model, so promoting a table moves
# them; a gate pinned to them fails on every run after a promotion and points
# at the companion, which did not change. That is exactly what happened between
# 2026-10-13 and 2026-10-14. The snapshot below plans over nothing, so only the
# companion can move it.
#
# `test_cost_model_lean.py` cannot serve as this gate: it compares the planner
# against itself, so a companion change moves both sides together and the
# comparison stays equal. Only a pinned transcript catches that.
#
# Regenerate after an intentional companion cost-model change:
#
#   lake env lean --run scripts/tests/RecursiveCostOracle.lean \
#     --costs 3 8 64 1024 2048 \
#     > scripts/tests/companion-cost-model.tsv
#   lake env lean --run scripts/tests/RecursiveCostOracle.lean \
#     --reference 64 1024 2048 4096 8192 16384 \
#     >> scripts/tests/companion-cost-model.tsv

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forshor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Lean
        run: ./scripts/ci/install_lean.sh

      # The companion pins Mathlib and `lean-toolchain` together, on purpose,
      # and our root pin names the same Mathlib revision it does. When it moves
      # the toolchain, `lake update` adopts the new one into this tree, our
      # pinned Mathlib no longer matches it, and Mathlib's post-update hook
      # fails the step with a message about a cache rather than about the
      # companion. Observed 2026-10-25, run 40169053651, when the companion
      # went v4.28.0 -> v4.36.0-rc1 in 52b331d.
      #
      # The Lean version is the environment every submission is judged in, so
      # moving it is a reviewed PR -- never an unattended push from this job.
      # Check before `lake update` mutates anything, and name the real cause.
      - name: Companion build environment unchanged
        run: |
          set -euo pipefail
          raw=https://raw.githubusercontent.com/VerifiedQC/ForShor/main
          theirs_lean=$(curl -fsSL "$raw/lean-toolchain" | tr -d '[:space:]')
          ours_lean=$(tr -d '[:space:]' < lean-toolchain)
          theirs_mathlib=$(curl -fsSL "$raw/lake-manifest.json" \
            | jq -r '.packages[] | select(.name=="mathlib") | .rev')
          ours_mathlib=$(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)

          # Advisory only. Our root pin governs the build, so a companion-only
          # Mathlib move either builds here or is caught by `lake build` below.
          # Failing on it would just add a second way for this cron to go red.
          if [ "$theirs_mathlib" != "$ours_mathlib" ]; then
            echo "::warning::Companion moved Mathlib $ours_mathlib -> $theirs_mathlib. Our root pin still governs; the build below decides whether that matters."
          fi

          if [ "$theirs_lean" != "$ours_lean" ]; then
            echo "::error::Companion moved Lean $ours_lean -> $theirs_lean. Not updating. Upgrading this repo's toolchain is a reviewed PR: it has to carry a matching Mathlib revision (the companion is on $theirs_mathlib), and scripts/ci/submission_syntax_gate.lean reads Lean frontend internals that move between versions."
            exit 1
          fi
          echo "Lean $ours_lean and Mathlib $ours_mathlib match the companion."

      - name: Resolve the companion's current main
        id: update
        run: |
          set -euo pipefail
          before=$(jq -r '.packages[] | select(.name=="Fast_multiplication") | .rev' lake-manifest.json)
          lake update Fast_multiplication
          after=$(jq -r '.packages[] | select(.name=="Fast_multiplication") | .rev' lake-manifest.json)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at $before; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$before -> $after"
          fi

      - name: Fetch Mathlib oleans
        if: steps.update.outputs.changed == 'true'
        run: lake exe cache get

      - name: Build
        if: steps.update.outputs.changed == 'true'
        run: lake build

      # Before the TSV gate, so a companion change that breaks the planner is
      # reported as that rather than as a stale pin.
      - name: Lean cost model checks
        if: steps.update.outputs.changed == 'true'
        run: python3 scripts/test_cost_model_lean.py

      # The gate. Everything the planner reads from the companion: primitive
      # gate costs, allocation costs, width transitions. Archive-independent by
      # construction, so a promotion cannot make it stale.
      - name: Companion cost model unchanged
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            lake env lean --run scripts/tests/RecursiveCostOracle.lean \
              --costs 3 8 64 1024 2048
            lake env lean --run scripts/tests/RecursiveCostOracle.lean \
              --reference 64 1024 2048 4096 8192 16384
          } > /tmp/companion-actual.tsv
          if ! diff -u scripts/tests/companion-cost-model.tsv /tmp/companion-actual.tsv; then
            echo "::error::The companion's cost model changed. Not pushing. Decide whether the change is wanted, re-measure the planner totals, then regenerate scripts/tests/companion-cost-model.tsv in a reviewed PR."
            exit 1
          fi
          echo "Companion cost model unchanged."

      - name: Commit
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lake-manifest.json
          # `[skip ci]` is belt and braces: this push is made with
          # `GITHUB_TOKEN`, which starts no workflow runs at all (observed
          # 2026-10-21 on promotion `67053f4`). Were it to start them,
          # `table-generation-promotion` and `sync-submission-template` have
          # nothing to do with a manifest bump, and this job has already built,
          # run the Lean cost-model checks and checked the totals.
          git commit -m "Update ForShor to $(git -C .lake/packages/Fast_multiplication rev-parse --short HEAD) [skip ci]"
          # The build takes about half an hour, so `main` may have moved since
          # checkout. Only `lake-manifest.json` is touched, so a rebase is safe;
          # the ruleset forbids non-fast-forward pushes, which this avoids.
          git pull --rebase origin main
          git push origin HEAD:main
