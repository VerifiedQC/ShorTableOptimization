name: Update ForShor

# Follows the companion's `main` branch. `lakefile.lean` tracks `main`, but
# `lake-manifest.json` pins a resolved commit and is what every build reads, so
# the dependency only advances when something runs `lake update`. That is this
# workflow.
#
# It pushes to `main` without review, which is safe only because it refuses to
# push unless the companion's cost model is unchanged. That is what
# `scripts/tests/companion-cost-model.tsv` pins: the primitive gate costs, the
# allocation costs and the width transitions, which is everything the planner
# reads from the companion. If any of it moves, the job fails and leaves `main`
# alone -- that bump is a decision, not a chore.
#
# The gate deliberately does NOT pin planner totals. Totals are a function of
# the accepted archive as well as the cost model, so promoting a table moves
# them; a gate pinned to them fails on every run after a promotion and points
# at the companion, which did not change. That is exactly what happened between
# 2026-10-13 and 2026-10-14. The snapshot below plans over nothing, so only the
# companion can move it.
#
# `test_recursive_cost.js` cannot serve as this gate: it compares Lean against
# JavaScript, and the JavaScript mirrors the Lean model, so a companion change
# moves both sides together and the comparison stays equal.
#
# Regenerate after an intentional companion cost-model change:
#
#   lake env lean --run scripts/tests/RecursiveCostOracle.lean \
#     --model=v3 --costs 3 8 64 1024 2048 \
#     > scripts/tests/companion-cost-model.tsv
#   lake env lean --run scripts/tests/RecursiveCostOracle.lean \
#     --model=v3 --reference 64 1024 2048 4096 8192 16384 \
#     >> scripts/tests/companion-cost-model.tsv

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forshor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Lean
        run: ./scripts/ci/install_lean.sh

      - name: Resolve the companion's current main
        id: update
        run: |
          set -euo pipefail
          before=$(jq -r '.packages[] | select(.name=="Fast_multiplication") | .rev' lake-manifest.json)
          lake update Fast_multiplication
          after=$(jq -r '.packages[] | select(.name=="Fast_multiplication") | .rev' lake-manifest.json)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at $before; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$before -> $after"
          fi

      - name: Fetch Mathlib oleans
        if: steps.update.outputs.changed == 'true'
        run: lake exe cache get

      - name: Build
        if: steps.update.outputs.changed == 'true'
        run: lake build

      - name: Lean/JavaScript differential
        if: steps.update.outputs.changed == 'true'
        run: node scripts/test_recursive_cost.js

      # The gate. Everything the planner reads from the companion: primitive
      # gate costs, allocation costs, width transitions. Archive-independent by
      # construction, so a promotion cannot make it stale.
      - name: Companion cost model unchanged
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            lake env lean --run scripts/tests/RecursiveCostOracle.lean \
              --model=v3 --costs 3 8 64 1024 2048
            lake env lean --run scripts/tests/RecursiveCostOracle.lean \
              --model=v3 --reference 64 1024 2048 4096 8192 16384
          } > /tmp/companion-actual.tsv
          if ! diff -u scripts/tests/companion-cost-model.tsv /tmp/companion-actual.tsv; then
            echo "::error::The companion's cost model changed. Not pushing. Decide whether the change is wanted, re-measure the planner totals, then regenerate scripts/tests/companion-cost-model.tsv in a reviewed PR."
            exit 1
          fi
          echo "Companion cost model unchanged."

      - name: Commit
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lake-manifest.json
          # `[skip ci]` because `table-generation-promotion` and
          # `sync-submission-template` both fire on any push to `main`, and
          # neither has anything to do with a manifest bump. This job has
          # already built, run the differential and checked the totals, so
          # nothing downstream would add a check that has not been made.
          git commit -m "Update ForShor to $(git -C .lake/packages/Fast_multiplication rev-parse --short HEAD) [skip ci]"
          # The build takes about half an hour, so `main` may have moved since
          # checkout. Only `lake-manifest.json` is touched, so a rebase is safe;
          # the ruleset forbids non-fast-forward pushes, which this avoids.
          git pull --rebase origin main
          git push origin HEAD:main
