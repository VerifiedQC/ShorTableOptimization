name: Report Table Generation Result

on:
  workflow_run:
    workflows: [Verify Table Generation]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed verification workflow run ID to report
        required: true
        type: string

permissions: {}

# No concurrency group. With `cancel-in-progress: false` GitHub still keeps only
# one run waiting and cancels the older pending one, so when two submissions
# finished together the loser lost its archive, its PR comment and its close --
# `submission-results` took 6 persists in 10 minutes on 2026-10-13, so this is
# not hypothetical. `persistFiles` now retries on the 422 that concurrent
# `updateRef` calls produce, which is the right way to serialise this: at the
# ref, not by throwing runs away.

jobs:
  report:
    name: Report Result
    # A cancelled verification run has nothing to report, and reading its
    # artifacts would be reporting on work that did not finish.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    permissions:
      # `write` so this job can dispatch promotion itself; see the last step.
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # Guards the trusted pull-request resolution: the policy identity and the
      # PR come from the run and the API, never from the uploaded artifact.
      - name: Check report trust logic
        run: node scripts/test_report_trust.js

      - name: Download verification artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: table-generation-submission-${{ github.event.workflow_run.id || inputs.run_id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Persist benchmark results
        id: persist
        if: >-
          hashFiles('artifacts/table-generation-results.json') != '' &&
          hashFiles('artifacts/table-generation-results.md') != '' &&
          hashFiles('artifacts/table-generation-submission-source.zip') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const reporting = require('./scripts/ci/table_generation_report.js');
            await reporting.persistBenchmarkResults({ github, context, core });

      - name: Report PR result
        if: always()
        uses: actions/github-script@v9
        env:
          RESULTS_JSON_URL: ${{ steps.persist.outputs.results_json_url }}
          OPERATIONS_JSON_URL: ${{ steps.persist.outputs.operations_json_url }}
          RESULTS_REPORT_URL: ${{ steps.persist.outputs.results_report_url }}
          SOURCE_ARCHIVE_URL: ${{ steps.persist.outputs.source_archive_url }}
          BENCHMARK_INDEX_URL: ${{ steps.persist.outputs.benchmark_index_url }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        with:
          script: |
            const reporting = require('./scripts/ci/table_generation_report.js');
            await reporting.reportPullRequestResult({ github, context, core });

      # Promotion used to trigger on this workflow's `workflow_run` conclusion.
      # That conclusion is `success` almost unconditionally -- the persist step
      # is `continue-on-error` and the comment step is `if: always()` -- so a
      # submission that FAILED verification still started the hour-long
      # promotion. Which runs promoted was therefore decided by a side effect
      # rather than stated.
      #
      # Start it explicitly, only when results were actually archived. Note the
      # absence of `continue-on-error`: if the dispatch fails, this job fails
      # loudly. The alternative -- swallowing it -- would stop promotion
      # happening at all with nothing to show for it.
      - name: Start promotion
        if: steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run table-generation-promotion.yml --ref main
