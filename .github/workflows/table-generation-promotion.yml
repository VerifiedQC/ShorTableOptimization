name: Promote Best-Known Table Generator

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Report Table Generation Result]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: table-generation-promotion-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  promote:
    name: Construct and Verify Promotion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          path: source
          fetch-depth: 0

      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false

      - name: Install Lean
        working-directory: source
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Test recursive cost model
        working-directory: source
        env:
          TABLE_GEN_RESULTS_ROOT: ../published-results
        run: node scripts/test_recursive_cost.js

      # The companion cost-model slice under TableGeneration/RecursiveCost/ForShor
      # is integrated, not depended on, so it can drift from upstream. This is
      # the drift check. It needs a companion checkout in $FORSHOR_ROOT and
      # skips cleanly without one, which is the normal case on a hosted runner --
      # it is here so a maintainer can supply one via workflow_dispatch and so
      # the step is not forgotten. It never reaches the network.
      - name: Check companion cost-model slice
        working-directory: source
        run: python3 scripts/check_forshor_slice.py

      - name: Construct and verify best-known generator
        working-directory: source
        run: python3 -m scripts.promote --results-root ../published-results

      - name: Publish verified best-known branch
        if: github.event_name != 'pull_request'
        working-directory: source
        run: python3 scripts/ci/publish_promotion.py
