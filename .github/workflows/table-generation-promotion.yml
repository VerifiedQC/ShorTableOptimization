name: Promote Best-Known Table Generator

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Report Table Generation Result]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  # Keyed on the pull request, else a single constant. Keying on `event_name`
  # put a `push` run and a `workflow_run` run in different groups, so two runs
  # that both end in a push to `main` could overlap.
  group: table-generation-promotion-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  promote:
    name: Construct and Verify Promotion
    # On a pull request this costs an hour, so it runs only when the pull
    # request touches something promotion builds or verifies. Every other event
    # runs it unconditionally -- `changes` has no base to diff against there and
    # reports `promotion=true`, and those are the events that can write `main`.
    needs: changes
    if: >-
      needs.changes.outputs.promotion == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request' ||
       github.event_name == 'push' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No write access: this job builds and runs untrusted archived Lean. It
    # only constructs and verifies the generator, then uploads the generated
    # files as an artifact. The separate `publish` job holds the token and runs
    # no Lean. See `scripts/ci/publish_promotion.py`.
    permissions:
      contents: read

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false

      # Cheap, and these guard the step that writes to `main` without review:
      # the allowlist and rebase that push the commit, and the layer-bound rule
      # that decides which tables enter the catalogue. Run them before the Lean
      # build so a broken gate fails in seconds rather than fifty minutes.
      - name: Check the promotion gate
        working-directory: source
        run: |
          python3 scripts/test_publish_promotion.py
          python3 scripts/test_archive_completeness.py

      - name: Install Lean
        working-directory: source
        run: ./scripts/ci/install_lean.sh

      # `lean-build-cache.yml` saves these from the repository root. A cache's
      # version is a hash of its `path`, so an entry saved at `.lake/packages`
      # cannot be restored at `source/.lake/packages`: the key matches, the
      # version does not, and the restore reports a miss. Restore at the saved
      # path, then move the tree into the checkout.
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('source/lake-manifest.json', 'source/lean-toolchain') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      - name: Move restored dependencies into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/packages ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/packages
            mv .lake/packages source/.lake/packages
            echo "restored dependency tree into source/.lake/packages"
          else
            echo "no dependency cache restored"
          fi

      - name: Fetch Mathlib oleans
        working-directory: source
        run: lake exe cache get

      # Without this the job recompiles every `TableGeneration` module, which is
      # most of its runtime. Lake re-checks module hashes, so a stale entry is
      # rebuilt rather than trusted. Same root-path treatment as above.
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('source/lean-toolchain', 'source/lakefile.lean', 'source/lake-manifest.json', 'source/TableGeneration.lean', 'source/TableGeneration/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Move restored build into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/build ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/build
            mv .lake/build source/.lake/build
            echo "restored build tree into source/.lake/build"
          else
            echo "no build cache restored"
          fi

      # The submission axiom audit is propext-only because nothing on the
      # submission path imports Mathlib. Nothing in Lean enforces that.
      - name: Check Mathlib confinement
        working-directory: source
        run: python3 scripts/check_mathlib_confinement.py

      - name: Construct and verify best-known generator
        working-directory: source
        run: python3 -m scripts.promote --results-root ../published-results

      # Lean-against-Lean checks that no theorem covers: the array width scan,
      # the dense and sparse planners, the reference candidates, the catalogue
      # ordering and two golden plan lines. They run here because Lean is
      # already built by this point, so they cost only their own runtime.
      - name: Lean cost model checks
        working-directory: source
        run: python3 scripts/test_cost_model_lean.py

      # Package the generated files for the publish job. The whole Accepted
      # directory is copied so the publish job can mirror deletions, not just
      # additions, when a policy leaves the catalogue.
      - name: Package the generated generator
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p generated
          cp source/TableGeneration/BestKnown.lean generated/BestKnown.lean
          cp source/TableGeneration/RecursiveCost/ArchivedCatalog.lean \
            generated/ArchivedCatalog.lean
          cp source/leaderboard/best-known.md generated/best-known.md
          cp -r source/TableGeneration/Policies/Accepted generated/Accepted

      - name: Upload the generated generator
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: promotion-generated
          path: generated
          retention-days: 1
          if-no-files-found: error

  # Push the verified generator to `main`. This job holds the only write token
  # in the workflow and runs no Lean: it lays the generated files the `promote`
  # job produced into a fresh `main` checkout and runs the allowlist gate. So
  # untrusted Lean is never built while a token that can write `main` is present.
  publish:
    name: Publish Promotion to main
    needs: promote
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To dispatch `lean-build-cache.yml` after publishing. A `GITHUB_TOKEN`
      # push starts no workflow runs, but an explicit `workflow_dispatch` does.
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download the generated generator
        uses: actions/download-artifact@v4
        with:
          name: promotion-generated
          path: generated

      - name: Lay the generated files into the tree
        run: |
          set -euo pipefail
          # Replace the generated outputs wholesale. Removing the Accepted tree
          # first makes a policy that left the catalogue show up as a deletion,
          # which publish_promotion.py's allowlist admits and git stages.
          rm -rf TableGeneration/Policies/Accepted
          mkdir -p TableGeneration/Policies TableGeneration/RecursiveCost leaderboard
          cp -r generated/Accepted TableGeneration/Policies/Accepted
          cp generated/BestKnown.lean TableGeneration/BestKnown.lean
          cp generated/ArchivedCatalog.lean \
            TableGeneration/RecursiveCost/ArchivedCatalog.lean
          cp generated/best-known.md leaderboard/best-known.md
          rm -rf generated

      - name: Promote to main
        env:
          # `gh workflow run` needs a token; the checkout's git credentials
          # cover the two pushes.
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_promotion.py

  # Which paths can change what promotion constructs or verifies. A pull request
  # that touches none of them skips the hour-long `promote` job. Every other
  # event has no base to diff against and so reports `true`.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promotion: ${{ steps.filter.outputs.promotion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare against the base
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Off a pull request there is no base to diff against, so assume yes.
          if [ -z "${BASE:-}" ]; then
            echo "promotion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: compare against the merge base, so commits that landed on
          # `main` after the branch started are not reported as this PR's changes.
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"

          # Includes the promotion and leaderboard tooling, whose own tests are
          # exactly what a change to them needs to run. A docs-only pull request
          # matches nothing here and so skips the 60-minute job.
          if echo "$changed" | grep -qE '^(TableGeneration/|TableGeneration\.lean|leaderboard/|scripts/promote\.py|scripts/leaderboard\.py|scripts/verifier\.py|scripts/ci/|scripts/test_|lean-toolchain|lakefile\.lean|lake-manifest\.json|\.github/workflows/table-generation-promotion\.yml)'; then
            echo "promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "promotion=false" >> "$GITHUB_OUTPUT"
          fi

