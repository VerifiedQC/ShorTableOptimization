name: Promote Best-Known Table Generator

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Report Table Generation Result]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: table-generation-promotion-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  promote:
    name: Construct and Verify Promotion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # `publish_promotion.py` opens the promotion pull request itself.
      pull-requests: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          path: source
          fetch-depth: 0

      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false

      - name: Install Lean
        working-directory: source
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `lean-build-cache.yml` saves these from the repository root. A cache's
      # version is a hash of its `path`, so an entry saved at `.lake/packages`
      # cannot be restored at `source/.lake/packages`: the key matches, the
      # version does not, and the restore reports a miss. Restore at the saved
      # path, then move the tree into the checkout.
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('source/lake-manifest.json', 'source/lean-toolchain') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      - name: Move restored dependencies into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/packages ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/packages
            mv .lake/packages source/.lake/packages
            echo "restored dependency tree into source/.lake/packages"
          else
            echo "no dependency cache restored"
          fi

      - name: Fetch Mathlib oleans
        working-directory: source
        run: lake exe cache get

      # Without this the job recompiles every `TableGeneration` module, which is
      # most of its runtime. Lake re-checks module hashes, so a stale entry is
      # rebuilt rather than trusted. Same root-path treatment as above.
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('source/lean-toolchain', 'source/lakefile.lean', 'source/TableGeneration/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Move restored build into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/build ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/build
            mv .lake/build source/.lake/build
            echo "restored build tree into source/.lake/build"
          else
            echo "no build cache restored"
          fi

      # The submission axiom audit is propext-only because nothing on the
      # submission path imports Mathlib. Nothing in Lean enforces that.
      - name: Check Mathlib confinement
        working-directory: source
        run: python3 scripts/check_mathlib_confinement.py

      - name: Construct and verify best-known generator
        working-directory: source
        run: python3 -m scripts.promote --results-root ../published-results

      - name: Publish verified best-known branch
        if: github.event_name != 'pull_request'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/publish_promotion.py

  # Which paths can change the cost model. A pull request that touches none of
  # them cannot move the Lean/JS differential, so the sweep is skipped. Pushes
  # to main always run it.
  changes:
    name: Detect cost-model changes
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.filter.outputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare against the base
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(TableGeneration/|scripts/tests/|scripts/test_recursive_cost\.js|leaderboard/site/recursive-cost\.js|lean-toolchain|lakefile\.lean|lake-manifest\.json)'; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
          fi

  # The Lean/JS differential. Runs beside the promotion job rather than inside
  # it, so the two do not add up, and only when the cost model can have moved.
  cost-model:
    name: Lean/JS cost model differential
    needs: changes
    if: >-
      needs.changes.outputs.model == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request' ||
       github.event_name == 'push' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          path: source
          persist-credentials: false
      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false
      - name: Install Lean
        working-directory: source
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `lean-build-cache.yml` saves these from the repository root. A cache's
      # version is a hash of its `path`, so an entry saved at `.lake/packages`
      # cannot be restored at `source/.lake/packages`: the key matches, the
      # version does not, and the restore reports a miss. Restore at the saved
      # path, then move the tree into the checkout.
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('source/lake-manifest.json', 'source/lean-toolchain') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      - name: Move restored dependencies into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/packages ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/packages
            mv .lake/packages source/.lake/packages
            echo "restored dependency tree into source/.lake/packages"
          else
            echo "no dependency cache restored"
          fi

      - name: Fetch Mathlib oleans
        working-directory: source
        run: lake exe cache get

      # Without this the job recompiles every `TableGeneration` module, which is
      # most of its runtime. Lake re-checks module hashes, so a stale entry is
      # rebuilt rather than trusted. Same root-path treatment as above.
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('source/lean-toolchain', 'source/lakefile.lean', 'source/TableGeneration/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Move restored build into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/build ]; then
            mkdir -p source/.lake
            rm -rf source/.lake/build
            mv .lake/build source/.lake/build
            echo "restored build tree into source/.lake/build"
          else
            echo "no build cache restored"
          fi

      # The submission axiom audit is propext-only because nothing on the
      # submission path imports Mathlib. Nothing in Lean enforces that.
      - name: Test recursive cost model
        working-directory: source
        env:
          TABLE_GEN_RESULTS_ROOT: ../published-results
        run: node scripts/test_recursive_cost.js
