name: Verify Table Generation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - submission/template
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: table-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout submission
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: submission
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout verifier
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Read benchmark config
        id: scoring
        working-directory: verifier
        run: python3 -m scripts.ci.export_benchmark_config >> "$GITHUB_OUTPUT"

      # All three take well under a second and run against the trusted verifier
      # checkout, not the submission. They cover the scanner hardening that
      # stops a banned token being hidden in a string, raw-string or character
      # literal; the import and namespace preflight that keeps a promoted policy
      # buildable; and the containment that keeps every admitted file inside the
      # source archive.
      - name: Check verifier hardening and archive completeness
        working-directory: verifier
        run: |
          python3 scripts/test_verifier_hardening.py
          python3 scripts/test_submission_preflight.py
          python3 scripts/test_archive_completeness.py

      - name: Run verifier preflight
        working-directory: submission
        env:
          TABLE_GEN_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TABLE_GEN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TABLE_GEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TABLE_GEN_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          TABLE_GEN_TARGETS: ${{ steps.scoring.outputs.targets }}
          TABLE_GEN_SCORE_WEIGHTS: ${{ steps.scoring.outputs.weights }}
        run: |
          python3 ../verifier/scripts/verifier.py --out-dir artifacts --preflight-only

      - name: Install Lean
        working-directory: verifier
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/55dc2814ca42ace25f05ba4dd7a43a8c701a0549/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Restore the build cache produced by `lean-build-cache.yml` on `main`.
      #
      # READ ONLY, deliberately. This job compiles untrusted fork-supplied Lean,
      # so it must never write a cache another run could restore. Only the
      # trusted `main` workflow writes.
      #
      # Restoring a `main` build into the submission tree is sound because the
      # preflight step above has already run, and it rejects any diff outside
      # `TableGeneration/Submission/`. Everything the cache covers is therefore
      # byte-identical to the base branch, and Lake's traces force a rebuild of
      # exactly the submission modules, which is the work we actually want.
      #
      # The key is computed from the VERIFIER checkout (the trusted base), not
      # the submission checkout, so a fork cannot steer which cache it gets.
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('verifier/lake-manifest.json', 'verifier/lean-toolchain') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      # A cache's version is a hash of its `path`. `lean-build-cache.yml` saves
      # from the repository root, so the entry has to be restored at the same
      # relative path and then moved into the checkout.
      - name: Move restored dependencies into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/packages ]; then
            mkdir -p submission/.lake
            rm -rf submission/.lake/packages
            mv .lake/packages submission/.lake/packages
            echo "restored dependency tree into submission/.lake/packages"
          else
            echo "no dependency cache restored"
          fi

      # No `lake exe cache get` here. The verifier builds
      # `TableGeneration.Submission.Correctness` and `TableGeneration.Metrics`,
      # and nothing in the import closure of either reaches Mathlib, so the
      # Mathlib oleans this fetched were never loaded. Promotion still fetches
      # them, because it builds the whole library.

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('verifier/lean-toolchain', 'verifier/lakefile.lean', 'verifier/lake-manifest.json', 'verifier/TableGeneration.lean', 'verifier/TableGeneration/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Move restored build into the checkout
        run: |
          set -euo pipefail
          if [ -d .lake/build ]; then
            mkdir -p submission/.lake
            rm -rf submission/.lake/build
            mv .lake/build submission/.lake/build
            echo "restored build tree into submission/.lake/build"
          else
            echo "no build cache restored"
          fi

      - name: Run verifier
        working-directory: submission
        env:
          TABLE_GEN_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TABLE_GEN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TABLE_GEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TABLE_GEN_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          TABLE_GEN_TARGETS: ${{ steps.scoring.outputs.targets }}
          TABLE_GEN_SCORE_WEIGHTS: ${{ steps.scoring.outputs.weights }}
        run: |
          python3 ../verifier/scripts/verifier.py --out-dir artifacts

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: table-generation-submission-${{ github.run_id }}
          path: submission/artifacts/
          if-no-files-found: warn
          retention-days: 90
